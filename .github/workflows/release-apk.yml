name: Release APK

# Push a tag (e.g. v1.0.0) to build a signed release APK and publish it as a
# GitHub Release. Manual runs (workflow_dispatch) build the APK and attach it to
# the run as an artifact, without creating a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # versionCode is derived from the commit count, so the full history is required.
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-deps-${{ runner.os }}-

      - name: Use dummy google-services json
        run: mv composeApp/src/google-services-dummy.json composeApp/src/google-services.json

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # uploadCrashlyticsMappingFileRelease is skipped: it 400s against the placeholder Firebase.
        run: ./gradlew :composeApp:assembleRelease -x uploadCrashlyticsMappingFileRelease --stacktrace

      - name: Locate APK
        id: apk
        run: echo "path=$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebble-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to a commit SHA (same pin as release.yml) since this is a third-party action.
        uses: softprops/action-gh-release@15d2aaca23625e5b2744248f7b68fc1e6bbff48e
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
